version: '3.9'
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: change_me
      CORS_ORIGIN: http://localhost:4173
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dengueye
      DB_USER: dengueye
      DB_PASSWORD: dengueye
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dengueye
      POSTGRES_USER: dengueye
      POSTGRES_PASSWORD: dengueye
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
